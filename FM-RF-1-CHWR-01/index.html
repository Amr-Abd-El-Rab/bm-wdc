<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BM-WDC Asset Register</title>
<style>
/* VOICE: plant-room asset register, calm and exact, for operators and the client.
   IDEA: the stainless tag plate on the pipe; every page is that plate opened up.
   PICTURE: the brushed-steel plate with colour band, engraved tag and its QR, at the top of each asset.
   COLOUR and TYPE: steel greys and deep ink, the schedule's type colours as bands, red only for out of range. system fonts, monospace for tags.
   LAYOUT: sticky dark bar, one column on phones, grid of tag cards on tablets. */
:root{color-scheme:light;--bg:#eef1f4;--card:#fff;--ink:#14202b;--ink2:#52616e;--line:#d6dde3;--acc:#0b5cad;--ok:#17834a;--bad:#c62828}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:clip}
a{color:var(--acc);text-decoration:none}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px max(4vw,14px)}
.top .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{background:#e0342b;font-weight:700;padding:2px 7px;border-radius:4px;font-size:13px}
.top b{font-weight:600}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px}
nav a{flex:none;color:#c9d3db;padding:8px 12px;border-radius:7px;font-size:15px;min-height:40px}
nav a.on{background:#2a3d50;color:#fff}
.pill{background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
main{max-width:1120px;margin:0 auto;padding:16px max(4vw,14px) 40px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.1;margin:6px 0 12px;text-wrap:balance}
.muted{color:var(--ink2)}.small{font-size:13px}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--ink2);font-weight:600}
.note{background:#fff8e1;border:1px solid #f1d98a;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
input,select{font:inherit;font-size:16px;padding:11px 12px;border:1px solid #b5c1cb;border-radius:8px;background:#fff;width:100%;min-height:44px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 16px;min-height:44px;background:var(--acc);color:#fff;cursor:pointer;display:inline-flex;align-items:center}
button.ghost,.btn.ghost{background:#e2e8ee;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #7fb2e5;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.asset{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;color:var(--ink);min-height:62px}
.asset .band{width:10px;flex:none}.asset .b{padding:9px 12px}
.asset .t{font:700 15px ui-monospace,"Roboto Mono",Consolas,monospace}.asset .d{font-size:13px;color:var(--ink2)}
.asset.done{opacity:.55}
.plate{display:flex;align-items:center;gap:14px;background:linear-gradient(170deg,#f4f6f8 0%,#d9dfe4 55%,#c9d0d6 100%);border:1px solid #9eabb5;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:inset 0 1px 0 #fff,0 2px 6px #0001}
.plate .band{align-self:stretch;width:14px;border-radius:3px;flex:none}
.plate .tag{font:700 clamp(20px,5.5vw,30px)/1.1 ui-monospace,"Roboto Mono",Consolas,monospace;word-break:break-all}
.plate .qr{width:clamp(76px,22vw,104px);margin-left:auto;flex:none}
table{width:100%;border-collapse:collapse}
.kv td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top;white-space:pre-line}
.kv td:first-child{width:38%;color:var(--ink2);font-size:14px}
.list th,.list td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left;vertical-align:top;font-size:14px}
.list th{font-size:13px;color:var(--ink2);font-weight:600}
.field{margin-bottom:16px}.field label{display:block;font-weight:600;margin-bottom:6px}.rng{font-weight:400;color:var(--ink2);font-size:13px}
.field.out input{border-color:var(--bad);background:#fff3f3}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{background:#e2e8ee;color:var(--ink);min-width:92px;justify-content:center}
.seg button.on{background:var(--ink);color:#fff}.seg button.on.badopt{background:var(--bad)}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.label{display:flex;align-items:center;gap:10px;border:1px solid #8a959e;border-radius:6px;padding:8px;background:#fff}
.label .band{align-self:stretch;width:10px;flex:none}.label .t{font:700 15px ui-monospace,"Roboto Mono",Consolas,monospace}.label .s{font-size:12px;color:#444}
.label .q{width:92px;margin-left:auto;flex:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;z-index:9;max-width:90vw}
.pos{border-left:6px solid var(--acc)}.pos .big{font-size:22px;font-weight:700;margin-bottom:4px}.pos p{margin:4px 0}
.card h3{font-size:15px;margin:14px 0 6px}.steps{margin:8px 0 4px;padding-left:20px;font-size:14px}.steps li{margin:3px 0}.nw{white-space:nowrap}
.dwgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}.dwgs figure{margin:0}.dwgs img{width:100%;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;background:#fff}.dwgs figcaption{font-size:13px;color:var(--ink2);margin-top:4px}
.lb{position:fixed;inset:0;background:#000d;z-index:20;overflow:auto;padding:12px;text-align:center}.lb img{max-width:none;width:min(1600px,220vw);background:#fff}.lb span{position:fixed;top:10px;right:14px;color:#fff;background:#0008;padding:6px 10px;border-radius:6px}
@media(max-width:600px){.stack tr:first-child{display:none}.stack tr{display:grid;padding:8px 0;border-bottom:1px solid var(--line)}.stack td{border:0;padding:2px 0}}
</style>
</head>
<body>
<header class="top">
  <div class="r1"><span class="logo">BM</span><b>BM-WDC Chilled Water Assets</b><span class="small muted" style="color:#9fb0bf">Banque Misr West Cairo DC</span></div>
  <nav id="nav">
    <a href="#" data-v="">Assets</a><a href="#tour" data-v="tour">Daily tour</a>

</header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<div id="lb" class="lb" hidden onclick="this.hidden=true"><img alt="Drawing"><span>Tap to close</span></div>

    if (!rec.work || !rec.by) { toast('Fill in work done and your name'); return; }
    try { localStorage.setItem('bmwdc-name', rec.by); } catch (e) {}
    (mine.maint = mine.maint || []).push(rec); persist(); toast('Maintenance saved'); viewAsset(tag);
  };
}
function woTable(list, actions) {
  return '<table class="list stack"><tr><th>Work order</th><th>Asset</th><th>Issue</th><th>Status</th></tr>' + list.map(w =>
    '<tr><td class="small">' + esc(w.id) + '<br><span class="muted">' + esc(w.opened) + ' · ' + esc(w.by) + '</span></td><td>' + (byTag(w.tag) ? '<a href="#' + encodeURIComponent(w.tag) + '">' + esc(w.tag) + '</a>' : esc(w.tag)) + '</td><td>' + esc(w.title) + '<div class="small muted">' + esc(w.detail) + '</div>' +
    (w.closeNote ? '<div class="small ok">Closed: ' + esc(w.closeNote) + '</div>' : '') + '</td><td><span class="' + (w.status === 'Open' ? 'bad' : 'ok') + '">' + w.status + '</span>' +
    (actions && w.status === 'Open' ? '<div class="row" style="margin-top:6px"><input placeholder="What was done?" data-n="' + esc(w.id) + '"><button class="ghost" data-c="' + esc(w.id) + '">Close</button></div>' : '') + '</td></tr>').join('') + '</table>';
}

// ---------- reading form ----------
function viewRead(tag, done) {
  const a = byTag(tag), checks = tour.checks[a.type] || [], vals = {};
  window.scrollTo(0, 0);
  $app.innerHTML = plate(a) + '<div class="card"><h2>Record reading · ' + today() + '</h2>' +
    '<div class="field"><label>Your name</label><input id="who" value="' + esc((() => { try { return localStorage.getItem('bmwdc-name') || ''; } catch (e) { return ''; } })()) + '"></div>' +
    checks.map((c, i) => '<div class="field" id="f' + i + '"><label>' + esc(c.f) + ((c.min != null) ? ' <span class="rng">range ' + c.min + '–' + c.max + ' ' + (c.u || '') + '</span>' : '') + '</label>' +
      (c.opt ? '<div class="seg" data-i="' + i + '">' + c.opt.map(o => '<button type="button" data-v="' + esc(o) + '"' + (c.ok && !c.ok.includes(o) ? ' data-bad="1"' : '') + '>' + esc(o) + '</button>').join('') + '</div>'
             : '<input type="number" inputmode="decimal" step="any" data-i="' + i + '" placeholder="' + esc(c.u || '') + '">') +
      '<div class="small bad" id="m' + i + '"></div></div>').join('') +
    '<div class="field"><label>Note (optional)</label><input id="note" placeholder="Anything unusual"></div>' +
    '<div class="row"><button id="save">Submit reading</button><button class="ghost" id="cancel">Cancel</button></div></div>';
  const check = i => {
    const c = checks[i], v = vals[i];
    if (v == null || v === '') { document.getElementById('f' + i).classList.remove('out'); document.getElementById('m' + i).textContent = ''; return null; }
    const out = c.opt ? !!(c.ok && !c.ok.includes(v)) : (isNaN(parseFloat(v)) || parseFloat(v) < c.min || parseFloat(v) > c.max);
    document.getElementById('f' + i).classList.toggle('out', out);
    document.getElementById('m' + i).textContent = out ? 'Out of range: a work order will be raised' : '';
    return out;
  };
  $app.querySelectorAll('.seg').forEach(s => s.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    s.querySelectorAll('button').forEach(x => x.classList.remove('on', 'badopt'));
    b.classList.add('on'); if (b.dataset.bad) b.classList.add('badopt');
    vals[s.dataset.i] = b.dataset.v; check(+s.dataset.i);
  });
  $app.querySelectorAll('input[data-i]').forEach(inp => inp.oninput = () => { vals[inp.dataset.i] = inp.value; check(+inp.dataset.i); });
  document.getElementById('cancel').onclick = done;
  document.getElementById('save').onclick = () => {
    const who = document.getElementById('who').value.trim(), note = document.getElementById('note').value.trim();
    if (!who) { toast('Enter your name'); document.getElementById('who').focus(); return; }
    try { localStorage.setItem('bmwdc-name', who); } catch (e) {}
    const rec = { tag: a.tag, time: now(), user: who, vals: [] }, bad = [];
    checks.forEach((c, i) => {
      const st = check(i); if (st === null) return;
      rec.vals.push({ f: c.f, v: vals[i], u: c.u || '', min: c.min == null ? '' : c.min, max: c.max == null ? '' : c.max, st: st ? 'OUT' : 'OK' });
      if (st) bad.push(c.f + ' = ' + vals[i] + (c.u ? ' ' + c.u : '') + (c.min != null ? ' (range ' + c.min + '–' + c.max + ')' : ''));
    });
    if (note) rec.vals.push({ f: 'Note', v: note, u: '', min: '', max: '', st: 'NOTE' });
    if (!rec.vals.length) { toast('Enter at least one value'); return; }
    mine.readings.push(rec);
    if (bad.length) mine.wos.push({ id: 'WO-' + rec.time.replace(/\D/g, '').slice(0, 12) + '-' + Math.random().toString(36).slice(2, 5).toUpperCase(), tag: a.tag, title: 'Out-of-range reading on daily tour', detail: bad.join('; '), opened: rec.time, by: who, status: 'Open' });
    persist(); woCount();
    toast(bad.length ? 'Saved. Work order raised for ' + bad.length + ' out-of-range value(s).' : 'Reading saved');
    done();
  };
}

// ---------- tour ----------
const tourAssets = r => ASSETS.filter(a => r.types.includes(a.type) && (!r.floor || a.floor === r.floor));
function viewTour(id) {
  const r = tour.routes.find(x => x.id === id);
  if (!r) {
    $app.innerHTML = '<h1>Daily site tour</h1><p class="muted">Pick a route. Each reading is saved against the asset tag with the name and time; out-of-range values raise a work order automatically.</p><div class="grid">' +
      tour.routes.map(x => '<a class="card" href="#tour-' + x.id + '"><b>' + esc(x.name) + '</b><div class="small muted">' + tourAssets(x).length + ' assets</div></a>').join('') + '</div>';
    return;
  }
  const doneTags = {}; readings().forEach(x => { if (x.time.indexOf(today()) === 0) doneTags[x.tag] = 1; });
  const list = tourAssets(r), n = list.filter(a => doneTags[a.tag]).length;
  $app.innerHTML = '<h1>' + esc(r.name) + '</h1><p><b>' + n + ' of ' + list.length + '</b> done today · <a href="#tour">Change route</a></p><div class="grid">' +
    list.map(a => '<a class="asset' + (doneTags[a.tag] ? ' done' : '') + '" href="#" data-t="' + esc(a.tag) + '"><span class="band" style="background:' + color(a) + '"></span><span class="b"><span class="t">' + esc(a.tag) + '</span><div class="d">' + esc(a.desc) + ' · ' + (doneTags[a.tag] ? '<span class="ok">✓ done</span>' : 'pending') + '</div></span></a>').join('') + '</div>';
  $app.querySelectorAll('[data-t]').forEach(el => el.onclick = e => { e.preventDefault(); viewRead(el.dataset.t, () => viewTour(id)); });
}

// ---------- work orders ----------
function viewWo(filt) {
  filt = filt == null ? 'Open' : filt;
  const l = wos().filter(w => !filt || w.status === filt).reverse();
  $app.innerHTML = '<h1>Work orders</h1><div class="chips" id="wf">' + [['Open','Open'],['Closed','Closed'],['','All']].map(x => '<span class="chip' + (filt === x[0] ? ' on' : '') + '" data-s="' + x[0] + '">' + x[1] + '</span>').join('') + '</div>' +
    '<div class="card">' + (l.length ? woTable(l, true) : '<p class="muted">Nothing here.</p>') + '</div>';
  document.getElementById('wf').onclick = e => { const c = e.target.closest('.chip'); if (c) viewWo(c.dataset.s); };
  $app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    const note = $app.querySelector('[data-n="' + b.dataset.c + '"]').value.trim();
    if (!note) { toast('Write what was done first'); return; }
    mine.closed[b.dataset.c] = { closeNote: note, closed: now() }; persist(); toast('Work order closed'); viewWo(filt); woCount();
  });
}

// ---------- QR labels ----------
function viewQr() {
  $app.innerHTML = '<h1>QR labels</h1><p class="muted small">Each code opens that tag\'s page here. Screenshot or print from your browser; labels follow the colour key of the tag schedule.</p>' +
    '<div class="labels">' + ASSETS.map(a => '<div class="label"><span class="band" style="background:' + color(a) + '"></span><div><div class="t">' + esc(a.tag) + '</div><div class="s">' + esc(a.desc) + '<br>' + esc(a.floor) + (a.connected ? ' · ' + esc(a.connected) : '') + '</div></div><div class="q">' + qrSvg(qrUrl(a.tag)) + '</div></div>').join('') + '</div>';
}

route();
}
</script>
</body>
</html>
